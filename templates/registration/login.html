{% load static %}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · NYS Fire Training Scheduler</title><link rel="icon" href="{% static 'images/nysfiretools-logo.png' %}" type="image/png"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="login-page">
  <main class="login-card">
    <div class="brand dark"><img class="brand-logo" src="{% static 'images/nysfiretools-logo.png' %}" alt="NYSFIRETOOLS.com"><div><strong>NYS Fire</strong><span>Training Scheduler</span></div></div>
    <div class="login-copy"><p class="eyebrow">Authorized access</p><h1>Welcome back</h1><p>Sign in with your approved email address.</p></div>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="button primary" type="submit">Sign in</button></form>
    <p class="login-alternate">State instructor without an account? <a href="{% url 'instructor_register' %}">Request access</a></p>
  </main>
</body>
</html>
