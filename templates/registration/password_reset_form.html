{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · NYSFIRETOOLS</title><link rel="icon" href="{% static 'images/nysfiretools-logo.png' %}" type="image/png"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="login-page"><main class="login-card">
  <div class="brand dark"><img class="brand-logo" src="{% static 'images/nysfiretools-logo.png' %}" alt="NYSFIRETOOLS.com"><div><strong>NYSFIRETOOLS</strong><span>Account Access</span></div></div>
  <div class="login-copy"><p class="eyebrow">Account recovery</p><h1>Reset your password</h1><p>Enter the email address used for your account. If it is active, we will send a secure reset link.</p></div>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="button primary" type="submit">Send reset link</button></form>
  <p class="login-alternate"><a href="{% url 'login' %}">Return to sign in</a></p>
</main></body></html>
